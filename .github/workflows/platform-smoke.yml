name: Native platform smoke
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install locked dependencies through Windows PowerShell setup
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\Setup.ps1
      - name: Install locked dependencies through POSIX setup
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/setup.sh
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Exercise frontend regression tests
        working-directory: frontend
        run: node --test --test-reporter=tap test-ui.mjs
      - name: Check frontend types
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend assets
        working-directory: frontend
        run: npm run build
      - name: Check committed frontend assets
        run: git diff --exit-code -- workbench/static
      - name: Exercise native intake, ledger, reports and CLI
        shell: python
        run: |
          import json
          import os
          import platform
          from pathlib import Path
          import subprocess
          scratch = Path.cwd() / '.implementation' / 'tmp'
          scratch.mkdir(parents=True, exist_ok=True)
          os.environ['TMPDIR'] = str(scratch)
          os.environ['TEMP'] = str(scratch)
          os.environ['TMP'] = str(scratch)
          python = Path.cwd() / '.venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          print(json.dumps({'platform': platform.platform(), 'architecture': platform.machine(),
                            'native_shell': 'Windows PowerShell' if os.name == 'nt' else 'bash',
                            'scope': 'offline native platform smoke; not Windows 11 desktop or live mainframe acceptance'}), flush=True)
          results = []
          for pattern in ('test_review_html.py', 'test_html_review*.py', 'test_reports.py', 'test_guided_workflow.py', 'test_database*.py', 'test_local_agent*.py', 'test_retrieval.py', 'test_cics*.py', 'test_lineage_discovery.py', 'test_discovery_workflow.py', 'test_layout.py', 'test_runner.py', 'test_zowe_setup.py', 'test_native_cli.py', 'test_preflight.py', 'test_text_encoding.py', 'test_platform*.py', 'test_modernization_upgrade.py', 'test_rule_inventory.py', 'test_factory.py', 'test_economics.py', 'test_requirements_selection.py', 'test_runtime_validation.py', 'test_validation_policy.py', 'test_orchestration_validation.py', 'test_target_architecture.py', 'test_workstation_setup.py', 'test_connection_setup.py', 'test_db2_connection_setup.py', 'test_launch.py'):
              completed = subprocess.run([str(python), '-m', 'unittest', 'discover', '-s', 'tests', '-p', pattern], check=False)
              results.append({'scope': pattern, 'returncode': completed.returncode})
          for scope, arguments in (('layout', ['-m', 'workbench.layout', '--workspace', '.']),
                                   ('handoff', ['tools/check_handoff.py']),
                                   ('factory', ['tools/check_factory.py'])):
              completed = subprocess.run([str(python), *arguments], check=False)
              results.append({'scope': scope, 'returncode': completed.returncode})
          passed = all(result['returncode'] == 0 for result in results)
          print(json.dumps({'passed': passed, 'results': results}), flush=True)
          raise SystemExit(0 if passed else 1)
